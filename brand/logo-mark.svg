<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" xml:lang="en">
  <title>Rafayyl Engineering — Brand Mark</title>
  <desc>Square badge mark: gold building icon on deep navy background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1E365F"/>
      <stop offset="100%" stop-color="#050B16"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="112" height="112" rx="22" fill="url(#bg)" stroke="#C9A84C" stroke-width="1.5"/>

  <!-- Building mark -->
  <line x1="18" y1="107" x2="102" y2="107" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
  <line x1="26" y1="107" x2="26" y2="66" stroke="#D4B764" stroke-width="3" stroke-linecap="round"/>
  <line x1="94" y1="107" x2="94" y2="66" stroke="#D4B764" stroke-width="3" stroke-linecap="round"/>
  <polyline points="24,66 60,30 96,66" fill="none" stroke="#E6CB80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="36" y1="80" x2="84" y2="80" stroke="#C9A84C" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="36" y1="94" x2="84" y2="94" stroke="#C9A84C" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="60" cy="30" r="4.5" fill="#E6CB80"/>
  <circle cx="60" cy="30" r="2" fill="#0A1628"/>
  <line x1="14" y1="72" x2="14" y2="107" stroke="#7C6526" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="106" y1="72" x2="106" y2="107" stroke="#7C6526" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
</svg>
