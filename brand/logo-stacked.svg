<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img" xml:lang="en">
  <title>Rafayyl Engineering and Construction Limited — Stacked logo</title>
  <desc>Stacked/centred logo: gold building mark above the RAFAYYL wordmark.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1E365F"/>
      <stop offset="100%" stop-color="#050B16"/>
    </linearGradient>
  </defs>

  <!-- Mark badge centred -->
  <rect x="126" y="8" width="108" height="108" rx="20" fill="url(#bg2)" stroke="#C9A84C" stroke-width="1.5"/>

  <line x1="140" y1="103" x2="220" y2="103" stroke="#C9A84C" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="148" y1="103" x2="148" y2="64" stroke="#D4B764" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="212" y1="103" x2="212" y2="64" stroke="#D4B764" stroke-width="2.8" stroke-linecap="round"/>
  <polyline points="146,64 180,31 214,64" fill="none" stroke="#E6CB80" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="158" y1="78" x2="202" y2="78" stroke="#C9A84C" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="158" y1="91" x2="202" y2="91" stroke="#C9A84C" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="180" cy="31" r="4" fill="#E6CB80"/>
  <circle cx="180" cy="31" r="2" fill="#0A1628"/>
  <line x1="136" y1="70" x2="136" y2="103" stroke="#7C6526" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="224" y1="70" x2="224" y2="103" stroke="#7C6526" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Wordmark centred -->
  <text x="180" y="162" text-anchor="middle"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="4">RAFAYYL</text>

  <!-- Centre rule -->
  <line x1="60" y1="170" x2="300" y2="170" stroke="#C9A84C" stroke-width="0.75" opacity="0.65"/>

  <!-- Descriptor centred -->
  <text x="180" y="188" text-anchor="middle"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="600" fill="#C9A84C" letter-spacing="4">ENGINEERING · CONSTRUCTION</text>

  <text x="180" y="206" text-anchor="middle"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="11" font-weight="600" fill="#C9A84C" letter-spacing="4">LIMITED</text>

  <!-- CAC -->
  <text x="180" y="226" text-anchor="middle"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="9" font-weight="400" fill="#7C6526" letter-spacing="2.5">CAC RC 7451347  ·  NIGERIA</text>
</svg>
