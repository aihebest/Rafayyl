<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 132" role="img" xml:lang="en">
  <title>Rafayyl Engineering and Construction Limited — Light version</title>
  <desc>Reversed logo for use on white or light-coloured backgrounds. Navy building mark with navy wordmark.</desc>

  <!-- ── Mark badge (light version) ──────────────── -->
  <rect x="8" y="10" width="108" height="108" rx="20" fill="#C9A84C" stroke="#A8893A" stroke-width="1.5"/>

  <!-- Building mark — navy on gold -->
  <line x1="22" y1="105" x2="102" y2="105" stroke="#050B16" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="30" y1="105" x2="30" y2="66" stroke="#050B16" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="94" y1="105" x2="94" y2="66" stroke="#050B16" stroke-width="2.8" stroke-linecap="round"/>
  <polyline points="28,66 62,33 96,66" fill="none" stroke="#050B16" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="80" x2="84" y2="80" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="40" y1="93" x2="84" y2="93" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="62" cy="33" r="4" fill="#050B16"/>
  <circle cx="62" cy="33" r="2" fill="#C9A84C"/>
  <line x1="18" y1="72" x2="18" y2="105" stroke="#7C6526" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="106" y1="72" x2="106" y2="105" stroke="#7C6526" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- ── Wordmark (dark) ───────────────────────────── -->
  <text x="136" y="77"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="54" font-weight="700" fill="#0A1628" letter-spacing="4">RAFAYYL</text>

  <line x1="136" y1="84" x2="666" y2="84" stroke="#C9A84C" stroke-width="0.8" opacity="0.8"/>

  <text x="137" y="100"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="11.5" font-weight="600" fill="#A8893A" letter-spacing="5">ENGINEERING  ·  CONSTRUCTION  LIMITED</text>

  <text x="138" y="116"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="9" font-weight="400" fill="#A8893A" letter-spacing="2.5">CAC RC 7451347  ·  NIGERIA</text>
</svg>
