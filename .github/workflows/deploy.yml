name: 🚀 Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger Vercel Production Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Vercel deploy hook
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('✅ Deploy triggered — job ID:', r.get('job',{}).get('id','n/a'))"

      - name: Wait and verify site is live
        run: |
          echo "⏳ Waiting 30s for deployment to complete..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://rafayyl.com)
          if [ "$STATUS" = "200" ]; then
            echo "✅ https://rafayyl.com is live (HTTP $STATUS)"
          else
            echo "⚠️  Site returned HTTP $STATUS — deployment may still be in progress"
          fi
